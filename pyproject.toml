[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tbank-business-mcp"
version = "0.1.0"
description = "Local MCP server for a T-Bank Business sole proprietor account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=1.6,<2",
]

[project.scripts]
tbank-business-mcp = "tbank_business_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tbank_business_mcp"]
